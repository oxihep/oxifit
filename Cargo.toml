[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/oxihep/oxifit"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
oxifit-formula = { path = "crates/oxifit-formula", version = "0.3.0" }
# Until oxistats is on crates.io it is a git dependency. `version` is kept so
# the switch is just dropping `git`/`tag`.
oxistats = { git = "https://github.com/oxihep/oxistats", tag = "v0.1.0", version = "0.1.0" }
minuit2 = "0.5"
argmin = { version = "0.11", default-features = false }
argmin-math = { version = "0.5", features = ["vec"] }

[profile.release]
opt-level = 3
lto = "thin"
