[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.10.1"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/oxihep/oxifit"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
# Casts that can lose information: fixed (`From`, `try_from`) or justified
# where they stand. `cast_precision_loss` stays off: the integer → f64 casts
# are counts (events, bins, walkers, steps), exact below 2⁵³.
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"
cast_lossless = "warn"

[workspace.dependencies]
oxifit-formula = { path = "crates/oxifit-formula", version = "0.10.1" }
# Until oxistats is on crates.io it is a git dependency. `version` is kept so
# the switch is just dropping `git`/`tag`.
oxistats = { git = "https://github.com/oxihep/oxistats", tag = "v0.2.1", version = "0.2.1" }
minuit2 = "0.5"
argmin = { version = "0.11", default-features = false }
argmin-math = { version = "0.5", features = ["vec"] }
rayon = "1"
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
