[package]
name = "oxifit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/oxifit"
readme = "../../README.md"
keywords = ["fit", "minuit", "least-squares", "hep", "physics"]
categories = ["science", "mathematics"]
description = "Parametric curve fitting (Minuit2) for any 1-D data — histograms, graphs, or custom points"

[dependencies]
minuit2 = { workspace = true }
oxistats = { workspace = true }
oxifit-formula = { workspace = true }
argmin = { workspace = true, optional = true }
argmin-math = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
rayon = { workspace = true }

[features]
# Opt-in second minimizer backend: gradient-free Nelder–Mead via the `argmin`
# crate, selectable with `FitOptions::minimizer(Minimizer::NelderMead)`. Off by
# default; Minuit2 (always present) is the default backend.
argmin = ["dep:argmin", "dep:argmin-math"]
# Evaluate costs over large datasets on all cores (chunked, with a fixed
# summation order, so results do not depend on the number of threads), and
# run independent fits — toys, profile points, contour rays — in parallel.
rayon = ["dep:rayon"]
# Read pyhf JSON workspaces into a `TemplateModel` (`Workspace::from_json`).
pyhf = ["dep:serde_json"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
